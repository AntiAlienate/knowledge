name: Validate knowledge base
on:
  # NOTE: push-trigger temporarily disabled to avoid email-storm from
  # race-condition between sequential content-API single-file commits.
  # Re-enable once aa-push uses atomic Git Data API multi-file commits.
  # push:
  #   branches: [main]
  #   paths:
  #     - 'practitioners/**'
  #     - 'case-studies/**'
  #     - 'schemas/**'
  #     - 'bin/**'
  #     - '.github/workflows/validate.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Weekly safety net so drift can't accumulate silently
  schedule:
    - cron: '0 6 * * 1'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install jsonschema
      - name: Validate schemas
        run: python bin/aa-build validate
      - name: Cross-link resolution (warn-only during migration)
        run: python bin/aa-build refs
      # When migration of legacy v1.0 entities completes, switch to:
      # run: python bin/aa-build refs --strict
      - name: Render (drift detection)
        run: |
          python bin/aa-build render
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Rendered MD files differ from JSON sources. Run 'python bin/aa-build render' locally and commit the result."
            git --no-pager diff
            exit 1
          fi
