name: Build and Deploy MkDocs site

# Build strategy: source content stays at repo root (so external links to
# /blob/main/case-studies/X.md keep working). At build time we symlink each
# content directory into a `docs/` staging directory, then point mkdocs at
# `docs/`. This satisfies MkDocs's restriction that `docs_dir` can't be
# the parent directory of the config file, without moving any source files.
#
# Auto-trigger is enabled on push to main once a manual workflow_dispatch
# run confirmed the symlink-staging step + non-strict build pass cleanly.
# We intentionally do NOT pass --strict: many source files contain
# pre-existing relative-link conventions (e.g. linking to `case-studies/`
# without a trailing `index.md`) that MkDocs warns about but that render
# correctly. Treating those as fatal would block every commit and force
# rewriting hundreds of canonical source files — that breaks external
# GitHub links by design (per Adam's instruction: no link breakage).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-mkdocs-${{ hashFiles('requirements.txt') }}
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ─── Stage content into docs/ via symlinks ──────────────────────
      # Source content directories live at the repo root so external
      # links (https://github.com/AntiAlienate/antialienate-knowledge/
      # blob/main/case-studies/X.md) keep working. We symlink each into
      # `docs/` so MkDocs has a child-directory `docs_dir` to point at.
      # No source files are moved or modified.
      - name: Stage content into docs/
        run: |
          set -e
          mkdir -p docs
          # Symlink every top-level content directory (anything that
          # contains .md files). Skip docs/ itself, .git, .github,
          # _site, and pure-config files.
          for d in */; do
            name="${d%/}"
            case "$name" in
              docs|_site|.git|.github|node_modules) continue ;;
            esac
            if find "$name" -maxdepth 3 -name "*.md" -print -quit | grep -q .; then
              if [ ! -e "docs/$name" ]; then
                ln -s "../$name" "docs/$name"
                echo "linked docs/$name -> ../$name"
              fi
            fi
          done
          # Symlink root-level docs files (README, CONTRIBUTING).
          for f in README.md CONTRIBUTING.md LICENSE LICENSE-DATA; do
            if [ -f "$f" ] && [ ! -e "docs/$f" ]; then
              ln -s "../$f" "docs/$f"
              echo "linked docs/$f -> ../$f"
            fi
          done
          echo "--- docs/ staging complete ---"
          ls -la docs/

      - name: Build site
        # Intentionally not --strict — see comment at top of file.
        # Pre-existing source-content relative-link warnings are not
        # fatal; MkDocs renders them sensibly and external GitHub links
        # to the same source files (e.g. /blob/main/case-studies/X.md)
        # continue to work because the source layout is unchanged.
        run: mkdocs build --site-dir _site
      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 7

  # === GitHub Pages deploy ===
  # Opt-in: set repo variable DEPLOY_TARGET=github-pages AND enable
  # GitHub Pages at repo Settings → Pages → Source: GitHub Actions.
  # Default behavior (no DEPLOY_TARGET set) is build-only — the site
  # artifact is produced and uploaded but no deploy attempt is made,
  # which keeps the workflow green when no hosting target is wired up.
  deploy-gh-pages:
    if: ${{ vars.DEPLOY_TARGET == 'github-pages' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # === Cloudflare Pages deploy ===
  # Set repo variable DEPLOY_TARGET=cloudflare and repo secrets CF_API_TOKEN + CF_ACCOUNT_ID.
  # Project must exist at Cloudflare Pages: antialienate-knowledge
  deploy-cloudflare:
    if: ${{ vars.DEPLOY_TARGET == 'cloudflare' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy _site --project-name=antialienate-knowledge --branch=main

  # === Firebase Hosting deploy (Google Cloud) ===
  # Set repo variable DEPLOY_TARGET=firebase and repo secret FIREBASE_SERVICE_ACCOUNT_KEY (JSON).
  # firebase.json + .firebaserc must exist at repo root.
  deploy-firebase:
    if: ${{ vars.DEPLOY_TARGET == 'firebase' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for firebase.json)
        uses: actions/checkout@v4
      - name: Download site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          channelId: live
          projectId: antialienate-knowledge
